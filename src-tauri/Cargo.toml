[package]
name = "sora-pos"
version = "0.1.0"
description = "Sora POS desktop app"
edition = "2021"

[lib]
name = "sora_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
